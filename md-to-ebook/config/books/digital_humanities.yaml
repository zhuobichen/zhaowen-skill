meta:
  title: AI驱动的数字人文与叙事分析
  author: 陈卓
  language: zh-CN
  output_file: AI驱动的数字人文与叙事分析.md

source: |
  ## 数字人文叙事分析调研（37KB）
  核心问题：从零散资料（聊天记录、邮件、文档）中重建"故事世界"。
  五个环节：人物识别（NER命名实体识别）→ 关系抽取（实体关系联合抽取）→ 情节重构（事件时间线排序）→ 性格刻画（人格特质计算）→ 命运预测（贝叶斯网络推断）。
  工具栈：spaCy/HanLP中文NER、OpenIE/DeepKE关系抽取、GPT-4情节链生成、Big Five人格模型、Prophet/LSTM时间序列预测。
  核心思路：像读小说一样理解"谁是谁"、"谁和谁什么关系"、"发生了什么事"。

  ## 情感考古与数字人类学技术指南（25KB）
  定义：用AI重建古代社会的情感结构、日常决策心理与文化情感模式。
  研究框架：数据来源层（考古文本+物质文化+人类遗骸+环境数据）→ AI分析层（情感分析+社会网络分析+行为模拟）→ 可视化层（情感地图+时间轴+关系图谱）。
  推荐项目：cltk（古典语言工具包）、VADER情感分析、NetworkX社会网络、Stable-Baselines3行为模拟。
  案例：古埃及书信情感热力图、希腊碑文道德词汇演变、玛雅城市ABM人口流动模拟。

system_prompt: |
  你是一位交叉学科研究者，精通数字人文、自然语言处理和AI技术。你在写一本面向零基础读者的教科书《AI驱动的数字人文与叙事分析》。
  
  排版铁律：
  1. 像教科书一样分段叙事，每段3-6句话。不用列表符号当主体内容。
  2. 章节开头用2-3段引入文字。
  3. 术语解释融入段落，比如"NER，也就是命名实体识别，简单说就是让程序从一段文字里自动识别出人名、地名、机构名"。
  4. 用"你"和"我"对话体讲课。
  5. 代码放```块内，代码前后必须有段落解释。
  6. 章节结尾有2-3段小结。
  7. 不要emoji，不要引用块(>)，不要用###三级标题碎。
  8. 仅用##做小节标题。内容靠段落组织。

chapters:
  - file: dh_ch01.md
    title: "# 第1章 当AI学会读故事——数字人文是什么"
    target_words: 5000
    prompt: |
      写第一章：当AI学会读故事——数字人文是什么。

      开篇用一个具体的场景：假设你拿到了一个人的完整微信聊天记录、邮件、工作文档。大约几万条消息。你想从中搞清楚几个问题：这个人的人际圈什么样？他和谁是好朋友、和谁有矛盾？最近几个月他经历了什么大事？他的性格是什么样的？这些事你如果自己去读几万条消息，需要几周。但用AI，可能只需要几分钟。

      从这个场景引出数字人文的定义。数字人文（Digital Humanities）就是把计算技术（AI、NLP、大数据）用到传统人文学科（历史、文学、考古、社会学）的研究中。传统人文学者翻故纸堆做研究，数字人文学者让AI翻故纸堆——不是替代人类的判断，而是放大人类的分析能力。

      然后讲数字人文的三个核心问题。第一，人物识别——你怎么让程序知道这段话提到了谁。第二，关系抽取——这些被提到的人之间是什么关系。第三，叙事重构——把零散的事件片段拼接成一个有情节、有因果、有情感的故事。这三个问题分别对应NLP里的命名实体识别（NER）、关系抽取（RE）、和事件时间线构建（Timeline Construction）。

      接着展开叙事分析的完整流水线。就像侦探破案一样，AI从一堆杂乱的信息中，先认出所有出场人物（Who），再分析他们之间的关系（Relation），然后按时间顺序排列所有事件（When+What），接着推断每个人的性格（Personality），最后基于已有模式预测接下来可能发生什么（Prediction）。这五个步骤是本书的核心方法论，每一章会深入讲一个步骤。

      最后引入情感考古的概念。数字人文不只是分析现代数据，也可以分析古代数据——古埃及的信件、古希腊的碑文、中国古代的简牍。你能用AI分析一个古罗马商人的会计记录来推断他的日常情感吗？你能从一份唐代敦煌文书里挖掘出当时丝绸之路商旅的心理状态吗？这就是情感考古——用数字人文的方法来开掘"古代人的内心世界"。这是本书独有的视角。

      结尾小结：数字人文不是简单地用电脑替代人脑，而是用AI做"放大镜"，让人文研究者能看清海量文本中隐藏的模式、趋势、和情感结构。下一章我们正式动手，搭一个能读中文故事的AI系统。

  - file: dh_ch02.md
    title: "# 第2章 人物识别——程序怎么认出「他」是谁"
    target_words: 6000
    prompt: |
      写第二章：人物识别——程序怎么认出「他」是谁。

      开篇：你有没有这样的体验？读一本小说读到一半，突然忘了"这个人物是谁来着？"。你不得不翻回前面找。人类尚且如此，电脑更惨——它连"人名"是什么都不知道。如果你想让AI分析一段文字里出现了哪些人物，第一步就是教它认人名。这个过程叫NER（Named Entity Recognition，命名实体识别）。

      第一大部分讲NER的基本原理。NER的核心任务是从一段自由文本中，找出所有"有名字的实体"——人名（PER）、地名（LOC）、机构名（ORG）、时间（TIME）、数量（QUANTITY）。传统方法靠规则——"如果有人名后面跟着'说'、'表示'、'认为'，那前面那段大概率是个人名"。现代方法靠深度学习——把文本喂给神经网络模型，让模型自己学会什么上下文环境下这个token是人名。比如BERT模型在处理"李华去北京出差"这句话时，会根据周围词判断"李华"是个人名。

      第二大部分讲中文NER的特殊难点。英文人名好认——大写字母开头。中文没有大小写，一个词是人名还是普通词完全看上下文。"雷达"可能是一个人的名字，也可能是一种探测设备。"王朝"可能是人名，也可能是历史时期。中文NER的主力模型是HanLP和LAC（百度词法分析器），它们在内置的海量语料上预训练过，能较准确地识别中文人名和地名。展示代码：import hanlp; tok = hanlp.load(hanlp.pretrained.tok.FINE); ner = hanlp.load(hanlp.pretrained.ner.MSRA_NER_BERT_BASE_ZH); ner(["李华去北京出差"])

      第三大部分讲怎么从NER到人物聚类——这才是实战里真正有用的。一段文字里可能用不同的方式提到同一个人："李华"、"小李"、"华哥"、"他"、"那个程序员"。人类知道这些都是同一个人，但NER不知道——它会把这些当成五个不同的实体。你需要一步额外的处理叫"共指消解"（Coreference Resolution），把所有指代同一人的说法合并。在中文里这特别难——"他"可能指李华也可能指王伟，需要结合上下文判断。

      第四大部分是实操：写一个完整的"人物画像提取器"。输入是文本，输出是每个出现人物的档案（名字、别名列表、出现次数、关联关键词、首次出现位置、与其他人的同时出现频率）。用Python实现，核心是NER+共指消解+频率统计+共现矩阵。每一步都有代码示例和逐行解释。

      结尾小结：人物识别是整个叙事分析流水线的第一步。这一步做不好，后面关系抽取和情节重构都是建在沙子上的城堡。但好消息是，现有的中文NLP工具已经足够强大，你不需要从零训练模型，直接调用HanLP或LAC即可。

  - file: dh_ch03.md
    title: "# 第3章 关系抽取——人物之间到底是什么关系"
    target_words: 6000
    prompt: |
      写第三章：关系抽取——人物之间到底是什么关系。

      开篇：上一章你已经能认出文本中出现的所有人物了。但认出了"李华"和"王伟"只是开始。接下来你要回答的问题是：李华和王伟是什么关系？他们是同事吗？朋友吗？上下级吗？李华对王伟的态度是亲近还是疏远、是信任还是敌意？这些问题不能靠单个人名来回答，需要分析他们"同时出现"的句子在说什么。这就是关系抽取（Relation Extraction）。

      第一大部分讲关系抽取的基本思路。最简单的方法是"共现推断"——如果两个人经常出现在同一个句子或同一个段落里，他们大概率有关系。但共现推断给不出关系的具体类型。更高级的方法是"模式匹配"——比如"李华是王伟的经理"这句话里，动词"是"和名词"经理"一起构成了一种"上下级"关系模式。现代方法是用预训练语言模型（如BERT）来做关系分类——输入一个包含两个人名的句子，模型直接输出他们之间最可能的关系类型。

      第二大部分讲关系类型的本体论。不是所有关系都值得抽取。常见关系类型包括：亲属关系（父子、夫妻、兄妹）、职场关系（同事、上下级、合作伙伴）、社交关系（朋友、敌人、暧昧）、互动关系（讨论、争论、协作）。你需要根据自己的研究目标选择要抽取哪些类型。在叙事分析场景下，最重要的不是你预定义的那些标签，而是人物之间的"情感极性"——李华对王伟是正面情感还是负面情感？这比"他们是同事"这个标签更有故事价值。

      第三大部分讲情感分析怎么和关系抽取融合。经典的情感分析工具VADER（Valence Aware Dictionary and sEntiment Reasoner）用一个预构建的情感词典对文本打分——每句话得出一个从-1（极度负面）到+1（极度正面）的分数。把这个分数打到每条"李华和王伟"同时出现的句子上，取平均值，就能得到"李华对王伟的情感倾向"。更进一步可以用基于情感的图谱——节点是人物，边的颜色代表情感正负，粗细代表互动频率。

      第四大部分是实操：用Python实现一个"人物关系图谱生成器"。输入NER结果和原文，输出一个JSON格式的关系网络（nodes列表+edges列表），每个边包含关系情感分值和出现次数。然后用NetworkX和matplotlib画出社交关系图——核心人物在中心、关系近的人物理距离近、关系远的物理距离远、正面关系用绿色边、负面关系用红色边。

      结尾小结：关系抽取让叙事分析从"认人"进入"懂关系"的阶段。一台能画出人物关系图谱的AI，就像一个能帮你读小说做笔记的助手。下一章我们更进一步——不再只看人物关系，而是重构整个故事的情节线。

  - file: dh_ch04.md
    title: "# 第4章 情节重构——把碎片拼成故事"
    target_words: 6000
    prompt: |
      写第四章：情节重构——把碎片拼成故事。

      开篇：你能认出人物了，也知道他们之间是什么关系了。但你还不知道"发生了什么"。读完一部小说，你会说"男主角经历了初恋-分手-重逢"——这是情节线。但如果你手里的是几万条微信聊天记录，你没办法快速说出"这三个月他经历了什么"。程序需要把事件提取出来、按时间排好、找出因果关系、重构出叙事弧线。这就是情节重构，也是整个流水线里最难的一步。

      第一大部分讲事件提取（Event Extraction）。什么是"事件"？一个事件通常包含四个要素：谁（主体）、做了什么（动作）、对谁（客体）、什么时候（时间）。从文本里提取事件就是找出所有包含了时间、主体、动词、客体的句子的过程。传统方法是模板匹配——"[某人] [做某事] [于某时]"就是一条事件模板。现代方法是序列标注——用BERT或者GPT这类模型标注出句子中哪些词是事件要素。对于一个做了大量预处理（NER+关系抽取）的文本，事件提取的准确率会显著提高。

      第二大部分讲时间线构建。提取出来的事件是散乱的，需要按时间排好。但文本中的"时间"通常不是日期格式——"上周二"、"三天后"、"当天下午"这样的相对时间，需要先找到文本的"时间锚点"（比如某条消息的发送时间），再往前或往后推算。这要求你的程序能理解中文时间表达。工具方面，Python的dateparser库和HanLP的时间表达式分析器可以解决大部分问题。

      第三大部分讲因果推理。时间上先后发生不等于因果。下雨和地面湿是因果关系，但"李华辞职"和"公司股票涨"可能只是巧合。判断因果需要更深的语义理解。目前最实用的方法是让LLM直接做因果判断——把两个事件描述喂给GPT，问"事件A是否是事件B的直接原因"。更严谨的做法是构建因果图（Causal Graph），用Pearl的结构因果模型框架来建模。

      第四大部分讲叙事弧线理论。经典叙事学里有"弗雷塔格金字塔"：开端（铺垫）→ 上升（冲突升级）→ 高潮（最紧张的时刻）→ 下降（后果展开）→ 结局。你的程序怎么自动检测一篇文章的叙事弧线？一个朴素的方法是画"情绪时间线"——每隔一段时间（比如每天）计算该时间段内所有消息的情感分数平均值，连成一条线。这条线的形状自然就反映了叙事弧线——平静期分数平稳、冲突期分数大幅波动、高潮附近出现最极端的正负值。

      结尾小结：情节重构是数字人文的皇冠难题。从事件提取到时间线到因果推理，每一步都在逼近"让机器读懂故事"这个终极目标。但即使是最先进的方法，也只能理解表层叙事——真正深层的象征、隐喻、主题还远远超出AI的能力边界。

  - file: dh_ch05.md
    title: "# 第5章 性格刻画与命运预测"
    target_words: 5000
    prompt: |
      写第五章：性格刻画与命运预测——AI比你自己更了解你。

      开篇：假设AI读了你一整年的聊天记录，它能判断你的性格吗？能预测你接下来可能会做什么吗？这两个问题听起来像科幻，但其实有成熟的心理学理论和AI技术支持。这一章我们不讲技术实现，而是讲讲这两个"心理推测"环节背后的方法论。

      第一部分讲性格推断的基础——五大人格模型（Big Five，也叫OCEAN模型）。心理学家经过几十年的研究，发现人类性格可以用五个维度来描述：开放性（Openness，喜欢尝试新事物还是保守传统）、尽责性（Conscientiousness，做事有条理还是随性）、外向性（Extraversion，社交活跃还是内向）、宜人性（Agreeableness，友善合作还是不合作）、神经质（Neuroticism，情绪稳定还是容易焦虑）。每个维度从低到高是一个连续光谱。

      怎么用文本推断性格？核心方法是语言心理学——一个人用的词汇和句法模式能反映他的性格。比如，开放性高的人常用"可能"、"也许"、"探索"这类词；尽责性高的人常用"计划"、"完成"、"应该"；外向性高的人常用"太棒了"、"一起"、"聚会"等。IBM的Personality Insights服务和开源工具LIWC（Linguistic Inquiry and Word Count，语言探查与词频统计）就是利用这个原理。

      第二部分讲命运预测。这个说法听起来很玄，但其实在NLP领域有很扎实的基础。它的核心思想是"行为模式预测"——如果你读了一个人过去一年的行为记录（他想做什么、他做了什么、他后悔了什么），你可以用序列预测模型来推断他接下来大概率会做什么。比如一个人连续三个月在聊天记录里提到"想辞职"但一直没行动，那下个月他找到新工作的概率显著高于平时。最常用的技术是马尔可夫链（基于当前状态预测下一状态的概率）和时间序列预测模型如Prophet或LSTM。把人物的财务、职业、社交、情感状态编码为多维时间序列特征，喂给预测模型，就能输出未来一段时间的"人物命运推测"。

      第三部分是实操：用一个简化的案例把前面五章的全流程串起来。给你一份虚构的角色微信聊天记录（约500条，涉及3个人物），你从第一章的NER认出这三个人，第二章的关系抽取画出了他们的社交网络，第三章的事件提取排出了一条时间线，第四章的情感分析给出了一条情绪曲线，第五章的性格推断给出了每个人的五大人格评分。最后生成一份完整的人物分析报告——包含人物档案、社交图谱、情节时间线、情绪趋势图、性格雷达图。

      结尾小结：当AI读你的聊天记录时，它看到的不是一个一个的汉字，而是一个有血有肉的人——你的喜怒哀乐、你的社交模式、你的性格特质。这不是科幻，这是已经在发生的技术。数字人文的魅力就在于此——它把文学、心理学、计算机科学融合在一起，让机器不仅会算，还会"读人"。

  - file: dh_ch06.md
    title: "# 第6章 情感考古——用AI发掘古人的内心世界"
    target_words: 6000
    prompt: |
      写第六章：情感考古——用AI发掘古人的内心世界。

      开篇：前面几章的方法不仅能分析现代人的聊天记录和小说，还能分析古代文本。想象一下：古埃及的一位商人在纸莎草上给远方的妻子写了一封信，抱怨旅途的艰辛和对她思念。两千年后，你用AI分析这封信，提取出他的情感状态——焦虑、思念、疲惫，以及他对妻子的情感——亲近、信任、依赖。再结合考古遗址中发现的食谱和居住痕迹，你可以推测出他在写信的当天吃了什么、住在什么样的房子里、窗外的温度大概是多少度。这就是情感考古——用数字人文的方法来开掘古代人的"内心世界"。

      第一大部分讲情感考古的数据来源。考古学传统上研究"硬文物"——陶器、石器、骨骼、建筑。但还有一类"软数据"长期以来被忽视或无法大规模处理：书信、日记、碑文、契约文书、诗歌。中国有敦煌文书、居延汉简，埃及有莎草纸书信，希腊有碑铭。这些文本里藏着古人的喜怒哀乐，但靠人工一篇篇读，需要几代人的时间。用AI来批量处理——OCR识别图片→NLP分词解析→NER提取人物→情感分析判断情绪——数万份古文档可以在几小时内完成。

      第二大部分讲三个实操案例。案例一：古埃及的书信情感档案。研究者用AI分析了数百封古埃及书信（跨越新王国时期），提取了每封信的发件人、收件人、情感极性。结果非常有趣——发给上级的信平均情感正面但高度形式化（"您最谦卑的仆人"），发给家人的信情感起伏更大但平均更真实。案例二：古希腊碑文的情感演变。研究者收集了从公元前8世纪到公元4世纪的数千条希腊碑文，用AI计算每条碑文的情感得分。一条明显的趋势是：早期碑文（古典时期）以荣誉、骄傲等正面情感为主，晚期碑文（希腊化时期）出现了更多怀旧、悲伤等复杂情感。案例三：古代敦煌的情感生活重建。通过敦煌文书中保存的信件、契约、抄经题记，AI绘制出了一幅约1200年前敦煌居民的情感图景。商人在信里抱怨路途遥远和安全问题，僧人在经书空白处写下祈祷家人平安的话，借契里透着焦虑和无奈。

      第三大部分讲跨文化情感比较。使用多语言NLP工具，你可以比较古代不同文明书写中情感表达方式的差异。古埃及人喜欢用隐喻来表达情感（"我的心像沙漠中的清风一样渴望见到你"），古希腊人更直接（"亲爱的某某，请务必来"），古代中国人则往往以景物寄情（"月落乌啼霜满天"）。程序不知道这些修辞是什么，但它能统计出古埃及文本中比喻词的使用频率远高于希腊文本。这就是AI能做、人眼不容易发现的跨文化模式。

      第四大部分是实操。如果你手头有一份已扫描并OCR好的古代中文文本（比如一份唐代信件），怎么能用前面几章的方法来分析它？关键预处理步骤是"古今语言映射"——古代中文和现代中文在词汇、语法上差异巨大，"尔"对应"你"、"吾"对应"我"。你需要一个古今词典来把文言词汇映射到现代白话，然后再跑标准的NER、关系抽取、情感分析流水线。展示一个端到端的代码流程：文言文本→古今词典映射→HanLP分词→NER人物识别→关系抽取→情感分析→人物关系图谱可视化。

      结尾小结：情感考古是数字人文最浪漫的分支。它用AI的"冷酷"算法，去触摸古人最温暖的内心。两千年前一个商人在沙漠里写的家书，今天被AI"读懂"了他的思念——这就是技术和人文相遇时迸发出的光彩。   

  - file: dh_ch07.md
    title: "# 第7章 搭一个你自己的叙事分析系统"
    target_words: 7000
    prompt: |
      写第七章：搭一个你自己的叙事分析系统。

      开篇：前面六章讲了很多理论和方法。这一章不讲理论了，我们动真格的——从零开始搭一个完整的叙事分析系统。这个系统能接收一段中文文本，输出一份人物分析报告（包含人物档案、社交关系图、情节时间线、情绪趋势和性格评分）。大约五百行Python代码，基于我们前面讲的所有方法。

      第一大部分讲系统架构设计。整个系统分为五个模块：数据加载模块（负责读入和清洗文本）、人物分析模块（NER+共指消解+人物档案）、关系分析模块（共现+情感极性+关系图谱生成）、情节分析模块（事件提取+时间线+情绪曲线）、报告生成模块（汇总输出Markdown/HTML格式的全景分析报告）。每个模块是一个独立的Python类，通过统一的接口互相调用。

      第二大部分手把手实现数据加载模块。你要处理的各种文本来源（.txt、.csv、聊天记录导出.json），统一转成内部格式——一个按时间排序的"段落列表"，每个段落包含文本内容和时间戳。处理聊天记录导出时，常见的格式是微信导出或QQ导出——冒号前面是发言人名字、后面是内容。用正则表达式解析这种格式。

      第三大部分实现核心流水线。逐一实现前面五章的方法，串联成一个Pipeline。设计一个NarrativeAnalyzer类作为总入口，内部依次调用EntityRecognizer（实体识别）、RelationExtractor（关系抽取）、EventExtractor（事件抽取）、SentimentAnalyzer（情感分析）、PersonalityInferer（性格推断）。重点不是每件事都从零写——NER用HanLP、情感分析用SnowNLP或调用LLM API、性格推断用词频统计加LIWC词典、关系抽取用共现加情感加模式匹配的混合方法。

      第四大部分实现报告生成。用Python的jinja2模板引擎，把JSON格式的分析结果渲染成一份可读的Markdown报告。报告包含以下内容：人物档案表格（姓名、别名、出现频率、关联关键词、性格评分）、社交关系图（NetworkX生成的PNG图）、情节时间线（TimelineJS格式的超文本时间线）、情绪趋势曲线（matplotlib生成的PNG折线图）、总结段落（调用LLM生成一段叙事总结文字）。把这些全部打包成一个HTML文件，可以直接在浏览器里看。

      第五大部分是完整的代码。给出完整的NatureAnalyzer类的源代码（约300行），包含从文本解析到报告生成的全流程。给出使用示例：analyzer = NarrativeAnalyzer(); analyzer.load("chat_log.txt"); analyzer.analyze(); analyzer.report("output.html")。读者复制这段代码到本地，安装依赖后就能跑。

      结尾：这是本书的最后一章。你从认识数字人文的第一步，走到了能独立搭建一个叙事分析系统的地步。你学会了用AI认人、看关系、拼故事、画情绪、猜性格。这些技能不只可以用在人文研究上，也可以用在任何需要"读懂信息中的人"的场景中——用户研究、市场分析、舆情监控、甚至只是为了更好地了解你自己和身边的人。数字人文不是一个遥不可及的学术概念，它是一套你在今天就能用起来的方法论和工具箱。
