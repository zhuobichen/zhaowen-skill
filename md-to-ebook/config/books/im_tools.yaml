meta:
  title: IM工具开发实战——从微信解密到飞书Agent
  author: 陈卓
  language: zh-CN
  output_file: IM工具开发实战——从微信解密到飞书Agent.md

source: |
  ## weflow-cli：微信聊天记录本地解密+导出+AI分析工具
  核心技术：微信加密数据库逆向——微信4.x使用WCDB内置加密（需通过FFI调用wcdb_api.dll提取运行时密钥），3.x使用SQLCipher（PBKDF2-HMAC-SHA1 64000迭代+AES-256-CBC逐页解密）。ChatService作为统一数据访问层自动检测版本路由。
  功能链：解密→导出(JSON/TXT/HTML/Excel)→AI分析(DeepSeek日报/月报，任务识别+回复追踪)→Obsidian知识库同步(MCP Server+双向链接+语义搜索)。
  安全设计：AES-256-GCM密钥加密绑定单机，隐私优先。
  优化方向：doctor诊断命令一键排查环境，wxid→昵称自动映射，隐私修复（删除测试文件中的真实密钥）。

  ## qchat-cli：QQ消息CLI全运维工具
  核心技术：NapCatQQ（基于NTQQ注入，协议转标准HTTP API）+ OneBot v11（:3000收发消息+好友+监听，200条/次限制）+ qce-bridge（:3001完整聊天历史导出，无限制msgId分页）+ QZone Web API（Cookie鉴权，uin/skey/p_skey计算g_tk参数，15+接口）。
  功能链：消息监听→AI自动回复→历史导出→说说批量管理→点赞/评论。
  qzone-go-api：Go语言纯标准库零依赖QQ空间API封装，支持Cookie和二维码两种登录。

  ## 微信公众号文章稳定下载方案
  当前问题：fetch()经第三方代理下载不稳定，缺少浏览器指纹、IP集中风险、重试简单。
  解决方案：三层回退架构——L1 Puppeteer无头浏览器（最高稳定性，真实浏览器指纹）→ L2 服务端直接fetch+微信UA → L3 外部代理兜底。
  关键思路：下载链路从"客户端+第三方代理"迁移到"服务端+真实浏览器"。

  ## 飞书CLI-Agent办公自动化
  飞书CLI 114+能力覆盖15业务域。5大AI Agent场景：会议秒记→知识库沉淀、8路并行拉取→个人全维度复盘、群内@机器人→自动化审批流程、多维表格→自动汇总分析、飞书文档AI辅助写作。
  核心范式：用户一句话触发→CLI多源并行拉取→AI综合分析→结构化输出到文档/表格。

  ## 支撑技术
  PocketFlow LLM缓存：磁盘JSON key/value存储，以完整prompt为key不做hash。核心亮点：重试感知跳过缓存（cur_retry>0时use_cache=False），防止反复命中错误响应。写入前reload_cache()防并发覆盖。
  Obsidian深度集成：从单向数据流升级为双向知识循环——阅读笔记系统、双向链接增强(typed links)、统一标签体系、语义搜索、RAG对话、微信读书同步。
  笔记模板系统化设计：参考obsidian-research-vault(四层知识管道+数字前缀目录)和Emile van Krieken方案(Typed Links+颜色编码)，覆盖元数据/链接语义/动态查询/视觉层次/进度追踪/评分系统6维度。

system_prompt: |
  你是一位全栈开发者，精通微信/QQ协议逆向、CLI工具设计和AI Agent开发。你在写一本面向有编程基础的读者的教科书《IM工具开发实战——从微信解密到飞书Agent》。

  **极其重要的格式规则（违反一条全书作废）：**
  1. 绝对禁止使用 ### 三级标题。只能用 ## 作为小节标题。正文用纯段落叙述，禁止用 - * 加粗列表代替正文。
  2. 每个 ## 小节下面至少要有4段文字。
  3. 每段文字 3-6 句话，段落之间空一行。
  4. 术语解释融入段落正文中，不要单独成行。
  5. 章节开头用 2-3 段引入。结尾用 2-3 段小结。
  6. 代码放三个反引号块内。代码块前后都要有一段解释文字。
  7. 禁止使用 emoji、引用块(>)、数字编号列表作为正文主体。
  8. 用「你」和「我」对话体，像老师在讲课。

chapters:
  - file: im_ch01.md
    title: "# 第1章 为什么要折腾IM工具——从需求到架构"
    target_words: 5000
    prompt: |
      写第一章：为什么要折腾IM工具——从需求到架构。

      开篇：你有没有想过，你每天花在微信和QQ上的时间，沉淀下来的聊天记录里藏着多少有价值的信息？同事在微信里给你布置的任务、朋友在QQ里分享的文章链接、公众号推送给你的行业动态——这些信息如果全凭人脑记忆和手动整理，效率极低。但如果有一套工具能自动解密聊天记录、用AI分析内容、把精华沉淀到你的知识库里，这些信息就变成了你的资产。

      引出本书要讲的三层工具链。底层是数据获取层——怎么把微信和QQ里加密的数据"撬出来"。微信的本地数据库是加密的，你需要逆向它的加密机制，从WCDB或SQLCipher中提取密钥并解密。QQ的消息需要借助NapCatQQ这个注入框架，通过OneBot协议转化为标准HTTP API。中间层是AI分析层——拿到数据之后，怎么用DeepSeek这类大模型自动识别"谁给你布置了什么任务"、"你是否回复了"。这涉及到LLM调用的缓存策略、重试机制、以及Prompt工程设计。上层是知识沉淀层——分析完的数据怎么进入你的Obsidian知识库、生成日报月报、甚至接入飞书做办公自动化。

      然后讲CLI工具设计的方法论。命令行工具看起来简单，但要做好非常难——尤其是面向非技术用户时。你要解决三个经典问题：用户不知道怎么开始（用引导式setup命令解决）、用户记不住参数（用昵称自动映射wxid/QQ号解决）、报错不知道怎么处理（用doctor诊断命令自动检查环境并给出修复建议）。这三个模式贯穿了本书涉及的weflow-cli和qchat-cli两个工具的设计。

      最后给出本书全景。前两章讲微信生态——weflow-cli的解密引擎和AI分析流水线。中间两章讲QQ生态——qchat-cli的消息系统和QZone空间管理。第五到七章讲下载、集成和跨平台——公众号文章稳定下载、Obsidian知识库深度集成、飞书Agent办公自动化。第八章是综合实战——把这些工具串起来构建你个人的"信息自动化处理管线"。每一章既有原理拆解也有代码示例，你可以边看边写。

      结尾小结：IM工具开发不是"做个爬虫"，而是打通"加密数据→结构化提取→AI理解→知识沉淀"的完整数据管线。掌握了这套方法论，微信和QQ就不再只是聊天软件——它们变成了你的个人信息基础设施。

  - file: im_ch02.md
    title: "# 第2章 微信数据库逆向——解密那堵墙"
    target_words: 7000
    prompt: |
      写第二章：微信数据库逆向——解密那堵墙。

      开篇：微信的聊天记录不是存在云端的，是存在你电脑本地的一个.db文件里的。但这个文件是加密的——你用任何数据库工具打开都只能看到乱码。微信在不同版本用了两套完全不同的加密方案：3.x版本用的是SQLCipher（一个开源的SQLite加密扩展），4.x版本用的是WCDB（微信团队自研的数据库框架，内置了一层自定义加密）。想解密它们，你需要两条完全不同的技术路线。这一章就带你走通这两条路。

      第一大部分讲微信3.x的SQLCipher解密。SQLCipher的加密机制是：PBKDF2-HMAC-SHA1做64000次迭代从密码生成加密密钥，然后用AES-256-CBC逐页加密数据库的每一页（每页4096字节）。每一页的结构是：16字节Salt（随机盐）+ 加密数据区 + 48字节保留区（包含16字节IV初始化向量 + 20字节HMAC校验 + 12字节保留）。要解密这个数据库，你需要两个东西：数据库文件和密钥。数据库文件在你电脑的微信数据目录里（路径取决于你的微信版本），密钥藏在微信进程的内存里。用OllyDbg或x64dbg附加到微信进程，在内存中搜索SQLCipher的密钥特征（通常是一个32字节的hex字符串），或者Hook微信的数据库打开函数来截获密钥参数。

      第二大部分讲微信4.x的WCDB解密。WCDB是微信团队基于SQLite改造的数据库框架，它在标准SQLite外面包了一层自定义加密层。和SQLCipher不同，WCDB的加密逻辑不在外部库，而是编译在wcdb_api.dll这个原生库里面。解密WCDB的关键是调用这个DLL的Native API——但你没有微信的私钥，不能直接调用。突破口是：微信进程启动时已经加载了wcdb_api.dll到内存中，并且已经完成了密钥的初始化。你可以写一个注入程序，通过FFI（Foreign Function Interface，外部函数接口）去调用微信进程里已经就绪的WCDB解密函数。Node.js用koffi库实现FFI调用，Python用ctypes。weflow-cli的ChatService模块封装了这两条解密路径——它先检测微信版本，然后自动路由到SQLCipher或WCDB解密路径，对上层暴露一个统一的"给我聊天记录"接口。

      第三大部分讲安全与隐私。解密微信数据库这件事在技术上完全可行，但在法律和道德上需要特别注意。第一，只解密你自己的数据库——这是你自己的数据，你拥有查看和使用的权利。第二，永远不要把你的解密工具或密钥发给别人——这等于把你的微信密码给了别人。weflow-cli的设计遵循"隐私优先"原则：解密密钥用AES-256-GCM加密后绑定到你当前机器的硬件指纹上，换了电脑这个密钥就失效。所有的数据处理都在本地完成，不上传到任何服务器。你在weflow-cli优化指南中看到的第一个优化点就是"修复隐私泄露"——早期版本的测试文件里不小心包含了真实的微信ID和密钥，需要立即删除并加入gitignore。

      第四大部分是实操。展示用Python写一个最小化的微信数据库解密脚本。第一步：找到微信数据目录（通常在C盘用户目录下），定位到Msg目录里的.db文件。第二步：检测微信版本（看WeChat.exe的文件版本号）。第三步：如果是3.x版本，用pysqlcipher3库加载数据库文件，传入从内存中提取的密钥。如果是4.x版本，用ctypes加载wcdb_api.dll，调用解密函数。第四步：执行SQL查询——SELECT * FROM Chat_xxx WHERE StrContent LIKE '%关键词%'——就能拿到明文聊天记录了。每一步都给出完整的Python代码和逐行解释。

      结尾小结：微信数据库解密是整个weflow-cli的基石。SQLCipher的64000次PBKDF2迭代和AES-256-CBC逐页加密，WCDB的自定义加密层——这些不是花架子，是微信团队花了很多精力做的安全防护。你学会了绕过它们，不是因为它们不够安全，而是因为数据在你的电脑上、密钥在你的内存里、解密逻辑在你的进程空间里——这些前提条件只要成立，任何加密都有被本地解密的可能。

  - file: im_ch03.md
    title: "# 第3章 AI日报与月报——让机器替你复盘"
    target_words: 7000
    prompt: |
      写第三章：AI日报与月报——让机器替你复盘。

      开篇：第二章你学会了把微信聊天记录"撬出来"。现在是满地的碎片——几千条消息散乱地摊在你面前。怎么看？一条条看？你需要AI帮你整理。weflow-cli设计了两种AI分析模式——日报（biz_daily.py）关注公众号推送的内容质量，月报（report命令）关注你和联系人的交互中"谁给你布置了什么任务、你有没有回复"。这一章就讲这两种模式背后的AI管线设计。

      第一大部分讲公众号日报的设计。你订阅的公众号每天推送几十篇文章，你没时间全看。日报系统的工作流程是：定时从微信数据库里提取今天新增的公众号文章列表→用Puppeteer无头浏览器渲染每篇文章的完整HTML→提取正文→清洗广告和无关内容→把清洗后的正文喂给DeepSeek V4→DeepSeek返回文章摘要和分类标签→按分类（AI、学术、新闻、文学等）整理成Markdown日报→可选同步到Obsidian。这里面的技术难点不是AI调用本身，而是公众号文章的正文提取——公众号文章的HTML结构千奇百怪，有的正文嵌套在多层div里，有的混着大量广告和推荐卡片。weflow-cli的做法是先渲染完整页面再提取最长的连续文本块，而不是直接用CSS选择器定位。

      第二大部分讲月报中的任务识别。report命令的月报不关注公众号，关注的是"人"。它把所有联系人的消息按时间汇总，然后给DeepSeek一个精炼过的prompt："以下是用户在过去30天内与各联系人的聊天记录。请识别每条消息中是否包含'TODO'、'请'、'帮忙'、'能否'等任务指示词。对每个识别出的任务，判断发送者是谁、任务内容是什么、接收者是否已回复。最后输出一个JSON格式的任务列表。"DeepSeek不仅识别任务，还标记每个任务的紧急程度——"请尽快"标记为紧急、"有空帮我看看"标记为普通。然后生成结构化月报：未回复清单（红色标记紧急项）、已回复追踪（完成/进行中状态）、AI月度总结（任务来源分布饼图、回复率统计、改进建议）。

      第三大部分讲AI调用的工程化。直接调用AI API很简单——构造prompt→发送请求→收结果。但生产环境里有很多细节要处理。第一个是缓存——公众号文章的内容不会变，如果每次日报生成都重新调用AI分析同一篇文章，会浪费大量token和费用。weflow-cli参考了PocketFlow的缓存设计：以完整prompt为key做磁盘JSON缓存，但在重试时跳过缓存（cur_retry>0时use_cache=False）。这个设计的精妙之处在于：如果AI第一次返回了格式不正确的JSON导致需要重试，第二次调用必须获得新的AI结果，而不是从缓存里再取出错误的那个。第二个是风控——连续大量调用AI API可能触发限流。weflow-cli在做月报时采用随机间隔策略，消息较短的（比如"好的"就两个字）间隔3-5秒，消息较长的（超过500字）间隔8-12秒。第三个是错误恢复——AI偶尔会返回不符合预期格式的内容，比如应该返回JSON却返回了纯文本。weflow-cli对每次AI返回值都做格式校验，如果不符合预期就重试（最多3次），重试时会在prompt里追加一句"请你务必返回正确格式的JSON，上次你返回了[错误内容]"

      第四大部分讲Prompt Engineering。AI分析的质量80%取决于prompt怎么写。日报的prompt不能只说"帮我总结这篇文章"，而是要给出具体规则。"请按以下格式输出：1. 一句话摘要（不超过30字）。2. 三个关键词。3. 适合的阅读人群（技术/管理/学术/大众）。4. 推荐指数（1-5星）。"月报的prompt更复杂——"请识别所有包含任务性质的对话。任务的定义是：有人在对话中向你发送了需要你完成某个动作的消息。输出JSON数组，每个元素包含sender（发送者昵称）、task（任务描述）、urgency（high/medium/low）、replied（是/否）、reply_summary（你的回复摘要）。"好的prompt是"给AI一把精确的尺子"，而不是"让AI自己猜你要什么"。

      结尾小结：AI分析管线是weflow-cli的大脑。它把原始的聊天记录转化成你可以直接看的日报和月报。日报帮你筛选信息流中的精华，月报帮你追踪人际交互中的任务。两者结合，微信不再是一个"聊完就忘"的工具——它变成了一个持续为你积累和整理信息的个人数据中枢。

  - file: im_ch04.md
    title: "# 第4章 QQ消息运维——NapCatQQ与OneBot协议"
    target_words: 7000
    prompt: |
      写第四章：QQ消息运维——NapCatQQ与OneBot协议。

      开篇：微信有加密数据库，QQ有完全不同的数据架构。QQ的消息存储在云端，本地没有完整的加密数据库可以解密。那怎么获取QQ的聊天记录和实时消息？答案是通过"注入"——把一段代码注入到QQ的桌面客户端进程中，让它把内部的协议通讯转成标准HTTP API。这个注入框架就是NapCatQQ。

      第一大部分讲NapCatQQ的工作原理。NapCatQQ不是一个独立的程序，它是一个"注入器"。它把自己的代码注入到QQ的桌面客户端（NTQQ）进程中，在这个进程内部拦截QQ和腾讯服务器之间的通信，然后把结果转化成HTTP API暴露在本地的3000端口。这就像在QQ的进程内部开了一扇"后窗"——所有从这个进程出去和进来的消息你都能看见了，而且你能通过HTTP请求"模拟"QQ的客户端行为——发消息、获取好友列表、加入群聊等。NapCatQQ对外暴露的协议叫OneBot v11，这是一套标准化的机器人通信协议。OneBot定义了一套标准的HTTP API——比如/send_private_msg发送私聊消息、/get_friend_list获取好友列表、/get_group_list获取群列表。因为OneBot是标准协议，任何支持OneBot的客户端（不仅仅是NapCatQQ）都能用同一套API。

      第二大部分讲消息系统的双通道设计。qchat-cli基于NapCatQQ构建，但它发现了一个关键问题：OneBot HTTP API有消息获取数量限制——每次只能拉200条。如果你想导出完整的聊天历史（比如几年的记录），200条限制会让这件事变得极其痛苦。解决方案是引入qce-bridge——这是一个独立的桥接服务，运行在3001端口，专门用于完整聊天历史的导出。它直接调用QQ NT的内部消息API（MsgApi），按msgId分页拉取，没有数量限制。两个通道的分工很明确：OneBot（3000端口）负责实时交互——发消息、收新消息、监听新消息。qce-bridge（3001端口）负责历史数据——批量导出聊天记录。这种"实时+历史"双通道设计是一个通用模式——实时通道追求低延迟、历史通道追求高吞吐，互不干扰。

      第三大部分讲QZone空间的API封装。QQ空间不是通过OneBot协议访问的，它有自己的Web API。qzone-go-api是一个Go语言写的QQ空间API库，它的特色是纯标准库、零第三方依赖。你可以在任何装了Go环境的电脑上编译运行它，不需要pip install任何东西。它支持两种登录方式：Cookie登录（提供uin和skey，自动计算g_tk鉴权参数）和二维码登录（GetQRCode→PollQRLogin轮询→获取Cookie）。覆盖了15个以上的接口：说说发布/删除/查询、点赞、评论、回复、好友列表、日志、相册/相片、视频、收藏、分享、留言板、私密日记、访客记录。qchat-cli把这个Go库的功能用Node.js重写了一遍，然后集成到CLI工具里。现在你可以在命令行里执行"qce qzone post 今天天气真好"来发一条说说，或者"qce qzone likes"查看谁给你的说说点了赞。

      第四大部分是实操：用qchat-cli构建一个自动回复机器人。这个机器人的工作流程很简单：监听新消息→收到消息后调用DeepSeek生成回复→发送回复。核心代码不到50行。先启动NapCatQQ并配好OneBot连接，然后启动qce-bridge桥接服务，最后在命令行里执行"qce listen"开始监听。当有新消息到达时，qchat-cli会触发一个回调函数，在这个函数里你可以拿到消息的发送者、消息内容、消息时间。把消息内容喂给DeepSeek，拿到AI生成的回复，再通过OneBot API发送回去。加上一个简单的判断——如果消息里包含"在吗"就回复"在的"，如果包含任务相关的词就回复"收到，我会处理"——一个基础版的AI聊天机器人就完成了。

      结尾小结：QQ的工具链和微信完全不同。微信走的是"本地数据库解密"路线，QQ走的是"进程注入+协议转换"路线。NapCatQQ做注入和协议转换，OneBot v11做标准化HTTP接口，qce-bridge补充历史数据导出能力，qzone-go提供空间管理API。四层分工协作，构成了完整的QQ消息运维体系。

  - file: im_ch05.md
    title: "# 第5章 公众号文章下载——与反爬虫的博弈"
    target_words: 6000
    prompt: |
      写第五章：公众号文章下载——与反爬虫的博弈。

      开篇：微信公众号文章有一个特点——你可以在微信里随时看，但只要你不点收藏，它就只存在于你的聊天记录里。而且公众号文章没有"导出为文件"的功能，你想把一篇文章保存到本地或者导入Obsidian，只能复制粘贴。更麻烦的是微信的反爬机制——你如果用普通的HTTP请求去抓公众号文章的URL，大概率拿不到正文，而是拿到一个"请在微信客户端打开"的提示页。这一章就讲怎么和微信的反爬机制博弈，稳定地下载公众号文章。

      第一大部分讲反爬的三大关卡。微信对公众号文章的访问做了三层防护。第一层是UA检测——如果你用普通的浏览器User-Agent去请求，微信直接拒绝。你必须伪装成微信客户端的UA（WeChat/xxx MicroMessenger/xxx）。第二层是Cookie验证——即使你用了微信UA，如果没有有效的微信Cookie（从你登录的微信客户端里提取的），微信还是会拒绝或者返回不完整的页面。第三层是频率限制——短时间内大量请求同一域名会被封IP。这三个关卡让普通的Python requests+BeautifulSoup方案几乎无法工作。

      第二大部分讲三种下载策略的回退式架构。weflow-cli的公众号下载方案设计了三层回退。最优先的是L1——Puppeteer无头浏览器。Puppeteer是Google开发的Node.js库，它可以驱动一个真实的Chrome/Chromium浏览器。因为它是真实的浏览器，它有真实的浏览器指纹、真实的JavaScript执行环境、真实的Cookie管理。微信的WAF（Web应用防火墙）无法区分Puppeteer和真实用户在浏览器里打开文章的行为。当Puppeteer加载完公众号文章页面后，直接用page.evaluate()提取正文内容。L1稳定但慢——每个页面需要2-5秒。如果L1因为某种原因失败（比如Chromium进程崩溃），自动降到L2——服务端直接fetch。L2使用Node.js原生fetch，设置微信UA头和从L1提取的Cookie，直接请求文章URL。L2快（毫秒级）但不够稳定——可能遇到反爬拦截。如果L2也失败，降到L3——外部代理中转。L3调用一个第三方的公众号文章解析服务（保留原有方案作为最后兜底）。三层逐级回退，保证"能下载的尽快下载，不能下载的换更稳的方式下载"。

      第三大部分讲服务端化改造。最初的下载方案是在客户端（用户的电脑上）通过fetch调用外部代理服务——稳定性很差，因为外部代理服务随时可能挂掉、被限流、或者改变API格式。weflow-cli的改造方案是把下载能力从"客户端+外部代理"迁移到"服务端+Puppeteer"——在本地运行一个独立的下载服务进程，这个进程维护了一个常驻的Chromium实例，所有下载请求都由这个进程处理。这样做的三个好处：一是Puppeteer只需要启动一次（而不是每下一篇文章就启动一次），大幅提升速度。二是Cookie和UA可以统一管理（不用每次请求都重新获取）。三是本地进程完全可控（不会像外部代理一样随时可能下线）。如果你不想在本地跑Puppeteer，也可以在服务器上部署——用Docker跑一个无头Chrome容器，配置好微信UA和Cookie，然后通过本地HTTP接口调用。

      第四大部分讲完整下载流程的代码实现。展示一个最小化的Node.js脚本——从微信数据库中提取今天所有公众号文章的URL→按L1→L2→L3逐层尝试下载→提取正文（去除HTML标签、广告、推荐卡片）→转成Markdown→按日期和分类保存→可选同步到Obsidian。每一步有完整代码和运行示例。

      结尾小结：公众号文章下载最核心技术决策是"什么时候用浏览器、什么时候用纯HTTP请求"。浏览器的优势是稳定——所有的反爬在真实浏览器面前形同虚设。纯HTTP请求的优势是速度——毫秒级 vs 秒级。三层回退架构就是在稳定性和速度之间取的动态平衡——能快则快，不能快就稳。

  - file: im_ch06.md
    title: "# 第6章 知识沉淀——Obsidian深度集成"
    target_words: 6000
    prompt: |
      写第六章：知识沉淀——Obsidian深度集成。

      开篇：前面几章你学会了从微信解密数据、用AI分析内容、从QQ获取消息。但数据拿到手之后要放哪？放到Obsidian。Obsidian是一个基于本地Markdown文件的知识管理工具，你可以把它理解为一个"私人维基百科"——所有的笔记、文章、想法都以Markdown文件形式存在你的硬盘上，你可以用双向链接把任意两个笔记连起来。weflow-cli设计了一套完整的Obsidian集成方案，把微信里的信息自动沉淀到你的知识库里。

      第一大部分讲数据流设计——从单向到双向。最初的集成方案是单向的——weflow-cli把公众号文章和聊天记录导出为Markdown文件，扔到Obsidian的Vault（笔记本）目录里，就完事了。但这样做数据的终点就是Vault——你在Vault里的任何修改（高亮、批注、补充）都不会影响weflow-cli的原始数据。深度集成方案的目标是把单向数据流变成双向知识循环。第一步是阅读笔记系统——公众号文章导入Vault后，weflow-cli不只是在Vault里放一份只读副本，而是创建一个可编辑的笔记页。你可以在上面高亮重点段落、在页尾写自己的批注和心得。第二步是双向链接增强——公众号文章里提到的概念（比如"CMAQ"、"数据融合"）自动生成双向链接[[概念]]。点击概念页可以看到所有引用了这个概念的公众号文章。第三步是语义搜索——把weflow-cli的semantic_search能力接入Obsidian，你可以在Obsidian里用自然语言搜索笔记——"上个月那篇讲PM2.5数据融合方法的文章在哪个笔记本里"。

      第二大部分讲MCP Server的实现。MCP（Model Context Protocol）是Claude用来连接外部服务的标准协议。weflow-cli实现了一个MCP Server，让Claude Code能直接查询你的Vault内容。当你在Claude Code里问"帮我找一下上周的公众号日报"，Claude通过MCP协议调用weflow-cli的vault_search工具，在Obsidian Vault里全文搜索"公众号日报 2026-05-2x"，然后把结果返回给你。这个MCP Server暴露了四个工具：vault_search（搜索Vault内容）、vault_query（按标签筛选）、contact_history（按联系人查询聊天记录）、biz_summary（获取指定日期范围的公众号文章摘要）。MCP Server的实现本身只有约200行TypeScript代码，关键是定义好每个工具的输入输出schema。

      第三大部分讲笔记模板的系统化设计。导入到Obsidian的笔记如果只是纯文本，过几天你就不会再看它了。好的笔记需要好的模板。weflow-cli参考了GitHub上两个经典的开源Obsidian模板——obsidian-research-vault（用数字前缀目录构建四层知识管道：00-Zotero文献管理→10-Literature文献笔记→20-Idea想法孵化→30-Permanent永久笔记）和Emile van Krieken的学术工作流（Typed Links颜色编码+Dataview动态查询）。综合两者，weflow-cli设计了一个六维模板：元数据层（frontmatter含aliases别名、tags标签、created创建日期、citekey引用键）、链接语义层（typed links如hasTopic/cites/relatesTo）、动态查询层（Dataview查询自动聚合相关内容）、视觉层次层（Obsidian原生callout语法实现引用和警告样式）、进度追踪层（reading-progress进度字段）、评分系统层（rating 1-5星+importance重要度标记）。这个模板不是一成不变的——你可以在weflow-cli的配置里自定义模板字段。

      结尾小结：知识沉淀是weflow-cli工具链的"最后一公里"。解密数据是手段、AI分析是方法，但最终目的是把这些信息变成你可以长期使用的知识资产。Obsidian的本地Markdown文件格式保证了这些知识永远不会因为某个App下架而丢失——它们是纯文本文件，你可以用任何编辑器打开。

  - file: im_ch07.md
    title: "# 第7章 跨平台办公——飞书Agent自动化"
    target_words: 6000
    prompt: |
      写第七章：跨平台办公——飞书Agent自动化。

      开篇：微信和QQ是个人的通讯工具，飞书是团队的办公平台。如果你的工作流涉及到团队协作——周会纪要、任务分配、项目文档——飞书自动化会让你省大把时间。飞书开源了一个CLI工具，包含了114+个命令覆盖15个业务域（消息、日历、文档、多维表格、审批等），几乎追平了飞书API的全部能力。这一章就讲怎么把飞书CLI和AI Agent结合起来，实现办公自动化。

      第一大部分讲五个实战场景。场景一是会议知识库自动沉淀——飞书的"妙记"功能会把会议录音转成文字并生成AI摘要。但这份摘要只存在飞书里，不会自动进入你的知识库。用飞书CLI定时拉取今天的会议妙记文本→用DeepSeek进一步压缩和结构化→自动写入Obsidian的会议笔记。场景二是个人全维度周复盘——飞书CLI同时从消息、日历、文档、审批、多维表格五个数据源拉取你过去一周的活动，汇总后喂给DeepSeek生成一份"你上周干了什么、完成了什么、有什么待办"的周报。因为拉取是并行的（8路并发），整个复盘报告的生成只需要30秒。场景三是群内机器人自动流程——在飞书群里@机器人说"查一下张伟的报销审批进度"，机器人自动调用飞书CLI查审批模块、拿到进度后回复到群里。场景四是多维表格自动汇总——你的团队可能用飞书多维表格管理项目进度、任务分配、Bug追踪。CLI定期拉取表格数据→AI分析→生成可视化报告→自动发到指定群或频道。场景五是飞书文档AI辅助写作——飞书CLI读写文档，AI生成初稿，人审阅修改，CLI自动更新发布。五个场景覆盖了会议、复盘、消息、表格、文档五个办公核心领域。

      第二大部分讲通用范式。这五个场景虽然业务不同，但架构完全一样——用户一句话触发→CLI多源并行拉取→AI综合分析→结构化输出。这个范式可以被拆解成三个可复用的组件。第一个是"多源拉取器"——一个统一的函数，接收一个数据源列表，返回所有数据源的拉取结果。内部用并发（Promise.all或asyncio.gather）同时请求多个数据源，减少等待时间。第二个是"AI分析器"——一个统一的prompt构建函数，根据数据类型和用户意图生成合适的prompt。第三个是"结构化输出器"——一个格式转换函数，把AI返回的JSON转成指定格式（Markdown报告、飞书消息卡片、多维表格行、文档段落）。这三个组件在五个场景中完全复用，只是配置不同。

      第三大部分讲安全与权限。办公自动化和个人工具的安全要求完全不同。个人工具你只需要保护自己的数据，办公自动化涉及整个团队的数据。飞书CLI的权限管理要特别注意：最小权限原则——只给Agent需要的权限，不需要的不给。操作审计——所有CLI操作都记录日志，以便追溯。敏感数据脱敏——如果Agent拉取的消息中包含手机号、身份证号等敏感信息，在送入AI分析前先做脱敏处理。审批二次确认——涉及审批操作（提交报销单、发布公告）的自动化流程，AI只生成草稿，最终操作必须由人工在飞书里点击确认。

      结尾小结：飞书Agent自动化把AI的能力从"个人提效"扩展到"团队提效"。五个场景都遵循"一句话触发→多源拉取→AI分析→结构化输出"的通用范式，三个可复用组件让新场景的开发成本极低。再加上权限和安全的考量，这套方案可以直接用于生产环境。

  - file: im_ch08.md
    title: "# 第8章 综合实战——构建个人信息自动化管线"
    target_words: 7000
    prompt: |
      写第八章：综合实战——构建个人信息自动化管线。

      开篇：前面七章你分别学了解密、AI分析、QQ运维、公众号下载、知识沉淀、办公自动化。这些模块独立工作时每个都不错，但真正的威力在于把它们串成一个完整的"个人信息自动化管线"——微信和QQ是你的数据来源、AI是你的分析引擎、Obsidian是你的知识仓库、飞书是你的协作出口。这一章就把全部模块串起来，构建一套7x24小时运行的个人知识自动化系统。

      第一大部分讲系统架构设计。整个管线分为四层。第一层是数据采集层——由两个守护进程组成。weflow-cli-daemon负责微信数据的采集：监控微信进程启动状态→微信启动后自动解密数据库→拉取新消息和新的公众号文章→推送到消息队列。qchat-daemon负责QQ数据的采集：保持NapCatQQ和qce-bridge的连接→监听新消息→推送到消息队列。两个守护进程的采集频率不同——微信公众号文章每6小时拉取一次（因为更新频率不高），聊天消息每5分钟拉取一次（需要及时性）。第二层是AI分析层——一个独立的分析Worker进程，从消息队列中取出待分析的数据，根据数据类型路由到不同的AI分析任务。公众号文章→DeepSeek分类+摘要→写入日报。聊天消息→DeepSeek任务识别→写入任务池。第三层是知识沉淀层——定时任务（cron）每小时触发一次Obisian同步，把分析完的日报和任务池数据写入Obsidian Vault，同时触发MCP Server索引更新。第四层是协作出口层——飞书Agent在特定条件下触发（每天早上9点推送日报到群、每周一早上推送周报到群）。

      第二大部分讲守护进程的实现。Python有两种常见的守护进程方案——守护线程和系统服务。线程方案最简单：在主程序中启动一个后台线程，循环执行采集→分析→沉淀的流程。优点是实现简单、容易调试。缺点是如果Python进程挂了，整个管线就停了。系统服务方案更健壮：用Windows的Task Scheduler或Linux的systemd把你的Python脚本注册为系统服务，即使进程挂了系统也会自动重启。展示完整的Windows Task Scheduler配置XML——每5分钟触发一次微信聊天消息采集、每6小时触发一次公众号文章采集、每天早上9点触发日报推送。

      第三大部分讲错误处理和监控。一个7x24小时运行的自动化管线不可能不出错——微信数据库版本升级了解密会失败、AI API偶尔会超时、Obsidian Vault文件被意外删除。你需要两样东西：错误恢复和监控告警。错误恢复策略：每个模块独立失败（微信解密失败了不影响QQ采集），每个操作都有重试机制（最多3次、指数退避等待），数据不会因为单个错误丢失（消息队列做数据缓冲）。监控告警策略：每隔30分钟检查一次管线健康状态——所有守护进程是否在运行、消息队列是否有积压、AIAPI是否可用、Obsidian Vault是否可写。如果发现异常，通过飞书机器人发送告警消息。监控本身也是一段Python脚本，同样注册为定时任务。

      第四大部分是完整代码。把前面七章的代码整合到一个Python项目中——项目结构是src/collectors/（微信采集器+QQ采集器）、src/analyzers/（日报分析器+月报分析器+任务识别器）、src/syncers/（Obsidian同步器）、src/notifiers/（飞书通知器）、src/scheduler/（定时调度器）。每个模块大约100-300行代码，总共约2000行。你可以直接复制这个项目结构到你的电脑上，配置好你的微信数据路径、QQ配置、DeepSeek APIKey和Obsidian Vault路径，然后运行python main.py就能启动整个管线。展示main.py的完整代码——启动所有守护进程和定时任务，处理SIGINT信号优雅关闭。

      结尾也是全书的结语。你从解密微信数据库的第一行代码，到构建完整的个人信息自动化管线，你已经不只是一个"会写工具脚本的程序员"了——你是一个能够设计并实现"持续运行的分布式系统"的工程师。微信和QQ不再只是聊天软件，它们变成了你的个人信息基础设施。公众号文章自动变成你的知识库条目，聊天记录自动变成你的任务清单，每周一早上自动收到的周报让你清清楚楚地知道自己上周做了什么。这套系统的价值不在于某个单点的技术，而在于"自动化"本身——把重复的事情交给机器、把思考的时间留给自己。这也是全书的最终主题：技术不是目的，让技术为你服务才是目的。