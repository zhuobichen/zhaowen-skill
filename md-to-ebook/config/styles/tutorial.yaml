# 教程风格配置

name: "教程风格"
description: "结构清晰、步骤化的教程写作风格"

model: "gpt-4o"
temperature: 0.5
max_tokens: 4000

rules: |
  1. 采用"目标 → 前置知识 → 步骤 → 总结"的结构
  2. 每个步骤用有序列表
  3. 关键操作配代码示例
  4. 添加"注意"和"提示"框
  5. 每章开头列出"你将学到"
  6. 每章结尾有"小结"和"下一步"

structure:
  chapter_opening: "## 你将学到\n- ..."
  chapter_closing: "## 小结\n..."
  callout_types:
    - tip: "💡 提示"
    - warning: "⚠️ 注意"
    - info: "ℹ️ 说明"
