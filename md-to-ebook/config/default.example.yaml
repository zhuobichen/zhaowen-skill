# 默认配置
# md-to-ebook-ai 核心配置

ai:
  default_model: "deepseek-chat"
  fallback_model: "deepseek-chat"
  api_base: "https://api.deepseek.com/v1"
  api_key: ""   # 在这里填你的 key，或改用环境变量 MD2BOOK_API_KEY
  max_tokens: 8000
  temperature: 0.7
  rate_limit: 30

ingest:
  supported_extensions:
    - .md
    - .markdown
    - .mdx
  max_file_size: 1048576
  encoding: utf-8

analyzer:
  embedding_model: "all-MiniLM-L6-v2"
  similarity_threshold: 0.85

export:
  default_format: pdf
  pandoc_path: "pandoc"
  mdbook_path: "mdbook"
  output_dir: "./output"

style:
  default: "principles"
  available:
    - tutorial
    - casual
    - principles
